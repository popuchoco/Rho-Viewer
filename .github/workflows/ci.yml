name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RhoViewerPortable/RhoViewerPortable.csproj

      - name: Build
        run: dotnet build RhoViewerPortable/RhoViewerPortable.csproj --configuration Release --no-restore

      - name: Run format and resource analyzer self-tests
        run: dotnet RhoViewerPortable/bin/Release/net8.0-windows/RhoViewerPortable.dll --format-self-test

      - name: Run Kart CRC self-test
        run: dotnet RhoViewerPortable/bin/Release/net8.0-windows/RhoViewerPortable.dll --kart-crc-self-test
