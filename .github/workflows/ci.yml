name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RhoViewerPortable.Tests/RhoViewerPortable.Tests.csproj

      - name: Build
        run: dotnet build RhoViewerPortable.Tests/RhoViewerPortable.Tests.csproj --configuration Release --no-restore

      - name: Run parser, updater security, UI virtualization/cache, localization, and DDS tests
        run: dotnet RhoViewerPortable.Tests/bin/Release/net10.0-windows/RhoViewerPortable.Tests.dll

      - name: Upload test runner for local real-data validation
        uses: actions/upload-artifact@v4
        with:
          name: Rho-Viewer-Tests-win-x64
          path: RhoViewerPortable.Tests/bin/Release/net10.0-windows/
          if-no-files-found: error
          retention-days: 14

      - name: Publish Windows x64 portable package
        run: >-
          dotnet publish RhoViewerPortable/RhoViewerPortable.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          -p:PublishSingleFile=false
          -p:DebugType=none
          -p:DebugSymbols=false
          --output RhoViewerPortable/publish/win-x64

      - name: Validate release tag matches project version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          [xml]$project = Get-Content RhoViewerPortable/RhoViewerPortable.csproj
          $projectVersion = $project.Project.PropertyGroup.Version | Select-Object -First 1
          if ($env:GITHUB_REF_NAME -ne "v$projectVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match project version v$projectVersion."
          }

      - name: Pack versioned release ZIP
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $releaseTag = $env:GITHUB_REF_NAME
          }
          else {
            [xml]$project = Get-Content RhoViewerPortable/RhoViewerPortable.csproj
            $projectVersion = $project.Project.PropertyGroup.Version | Select-Object -First 1
            $releaseTag = "v$projectVersion"
          }
          Compress-Archive `
            -Path RhoViewerPortable/publish/win-x64/* `
            -DestinationPath "RhoViewerPortable/publish/RhoViewerPortable_${releaseTag}_win-x64.zip" `
            -CompressionLevel Optimal `
            -Force

      - name: Upload Windows x64 portable package
        uses: actions/upload-artifact@v4
        with:
          name: Rho-Viewer-win-x64
          path: RhoViewerPortable/publish/win-x64/
          if-no-files-found: error
          retention-days: 14

      - name: Upload versioned release ZIP for release job
        uses: actions/upload-artifact@v4
        with:
          name: Rho-Viewer-Release-ZIP
          path: RhoViewerPortable/publish/RhoViewerPortable_*_win-x64.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download versioned release ZIP
        uses: actions/download-artifact@v4
        with:
          name: Rho-Viewer-Release-ZIP
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Rho Viewer Portable ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/RhoViewerPortable_${{ github.ref_name }}_win-x64.zip
